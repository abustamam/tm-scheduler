name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Inert today: GitHub offers merge queues only on organization-owned repos, and this one
  # is user-owned, so main uses strict branch protection instead. Kept so a queue is one
  # setting away if the repo ever moves to an org; harmless otherwise. See CLAUDE.md's
  # skill routing.
  merge_group:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/tm_test
    steps:
      - uses: actions/checkout@v5
      # Every job reads Bun's version from package.json's `packageManager`
      # (#995), never `latest`: Bun 1.3.14 and 1.4.2 handle an empty `bun run`
      # argument differently, so an unpinned runner passed locally and failed
      # here, and a new Bun release could turn main red with no commit behind
      # it. Upgrade deliberately by editing that one field. The path resolves
      # against the repo root even in the `extension` job.
      # bun-version-pin.guard.test.ts holds every setup-bun step to it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Lint & format
        run: bun run check
      - name: Typecheck
        run: bun run typecheck
      # Fail if schema.ts has changes not captured in a committed migration.
      # `drizzle-kit generate` writes a new migration only when the schema has
      # drifted from the snapshots; a non-empty git diff means someone edited
      # schema.ts without running `bun run db:generate`.
      - name: Migrations in sync with schema
        run: |
          bunx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::schema.ts has changes with no migration. Run 'bun run db:generate' and commit the result."
            git --no-pager diff drizzle
            exit 1
          fi
      # Apply the committed migrations (not `drizzle-kit push`) so CI exercises
      # the same migration files prod runs at deploy — catches a migration that
      # fails to apply, and keeps the test schema honest to the migration history.
      - name: Apply migrations
        run: DATABASE_URL=$TEST_DATABASE_URL bun run db:migrate
      # 19 suites run here that drive headless Chrome and FAIL rather than skip
      # when no browser is present in CI: every test file carrying the
      # "CI has no Chrome" refusal except the route hydration gate's two, which
      # run in the `hydration` job (21 files as of #1022). Among them:
      # print-page-count.test.tsx counts printed
      # sheets, print-density.test.tsx measures how large the type actually
      # prints once FitPage has scaled the sheet,
      # pinned-column-reachability.test.ts checks that the bottom of each
      # sticky column can still be scrolled to,
      # dialog-keyboard-reachability.test.ts checks that a dialog's controls
      # stay inside the viewport an on-screen keyboard leaves,
      # slide-fit-geometry.test.ts checks that a shrunk slide body lands inside
      # its box rather than behind the footer, and
      # splash-logo-geometry.test.ts checks that the club's mark on a splash is
      # sized from the shared proportions and stays inside the rule beneath it,
      # ballot-qr-print-fit.test.tsx checks that the printed ballot QR stays
      # large enough to scan without pushing a one-page agenda onto a second
      # sheet, and confirm-table-geometry.test.ts checks that the guest-book
      # confirm table scrolls its own box rather than the whole page at phone
      # width.
      # ubuntu-latest ships
      # google-chrome-stable today, so no install step is needed — but that is an
      # image detail outside this repo, so the dependency is named here. If this
      # job starts failing with "CI has no Chrome on PATH", add a browser setup
      # step; the gate is not optional.
      # The route hydration gate (#1000) is a browser-backed suite too, but it
      # does NOT run here: it starts a vite dev server and sweeps every route
      # (~5 min), so it runs in the `hydration` job below, in parallel (#1022).
      # EXCLUDE_ROUTE_HYDRATION_GATE is read by vitest.config.ts (only the exact
      # value "1" excludes) and set on
      # THIS step only; the `hydration` job fails if it ran zero gate tests.
      - name: Test
        run: bun run test
        env:
          EXCLUDE_ROUTE_HYDRATION_GATE: "1"
      - name: Build (client bundle + migrate runner)
        run: bun run build
      # Exercise the EXACT runner production boots (Dockerfile CMD runs
      # `node .output/migrate.mjs` before the server). The drizzle-kit step
      # above validates the migration files; this validates the bundled
      # runner itself (bundling, ./drizzle resolution, pool teardown) against
      # a fresh database, so a runner-specific failure breaks CI instead of a
      # production deploy.
      - name: Prod migrate runner (fresh DB)
        run: |
          PGPASSWORD=test psql -h localhost -U test -d tm_test -c 'CREATE DATABASE tm_migrate_runner;'
          DATABASE_URL=postgresql://test:test@localhost:5432/tm_migrate_runner node .output/migrate.mjs
          DATABASE_URL=postgresql://test:test@localhost:5432/tm_migrate_runner node .output/migrate.mjs

  # The route hydration gate (#1000, src/routes/route-hydration.test.ts) and its
  # harness's teardown test, and nothing else (#1022). It needs what `check`'s
  # Test step needs: Postgres with the migrations applied, and Chrome, which
  # ubuntu-latest ships (the gate FAILS rather than skips in CI without either).
  # `check` excludes these two files, so this job is the only place CI runs
  # them, and the last step fails it if the gate ran zero tests or skipped any.
  hydration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/tm_test
    steps:
      - uses: actions/checkout@v5
      # Bun version: see the comment on the `check` job's setup-bun step (#995).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Apply migrations
        run: DATABASE_URL=$TEST_DATABASE_URL bun run db:migrate
      - name: Route hydration gate
        run: bun run test:hydration --reporter=default --reporter=json --outputFile=hydration-report.json
      # A run that collected nothing, or skipped the sweep, must not read as a
      # pass: the gate's own "runs in CI" test only guards the files it is in.
      - name: Gate ran (test count)
        run: |
          jq -r '"gate tests: \(.numTotalTests) total, \(.numPassedTests) passed, \(.numPendingTests) skipped, \(.numTodoTests) todo"' hydration-report.json
          jq -e '
            .numTotalTests > 0
            and .numPassedTests == .numTotalTests
            and ([.testResults[].assertionResults[]
                  | select(.title == "hydrates every route without a mismatch" and .status == "passed")]
                 | length) == 1
          ' hydration-report.json > /dev/null || {
            echo "::error::The route hydration gate ran zero tests, skipped some, or never ran its sweep."
            exit 1
          }

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
      # Bun version: see the comment on the `check` job's setup-bun step (#995).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # wxt prepare generates the .wxt/ types the tsconfig extends; run it
      # explicitly rather than relying on postinstall lifecycle behavior.
      - name: Generate WXT types
        run: bunx wxt prepare
      - name: Typecheck
        run: bunx tsc --noEmit
      # NOT the root suite: this job is `working-directory: extension`, so this
      # runs the sub-package's own vitest (3 files, no browser). The
      # headless-Chrome gates described in the `check` job do not run here and
      # never did — that comment was copied into this job by mistake and named
      # suites this working directory cannot see. If you add a browser-backed
      # test under `extension/`, name the Chrome dependency here then.
      - name: Test
        run: bun run test
      # WXT_GAVELUP_URL unset → production default (https://gavelup.app),
      # which is the shape that ships.
      - name: Build
        run: bun run build
