<script>
"use strict";
// ---- Data ------------------------------------------------------------------
const TODAY = new Date("2026-10-23T12:00:00");
const R1_DUE = new Date("2026-11-30T12:00:00");
const DAYS_TO_R1 = Math.round((R1_DUE - TODAY) / 86400000);
const OFFICES = 7;
const DCP_GOALS = 10;

function rng(seed) {
	return () => {
		seed = (seed + 0x6d2b79f5) | 0;
		let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
		t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
		return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
	};
}
const rand = rng(1296);
const between = (lo, hi) => Math.round(lo + rand() * (hi - lo));

function sampleClub(name, pLive) {
	const live = rand() < pLive;
	const visited = rand() < 0.55;
	const club = { name, real: false, live, v1: visited ? "Oct" : null, v2: null, h: null };
	if (live) {
		const sched = 16;
		const members = between(12, 30);
		club.h = {
			held: sched - between(0, 4), sched,
			roleFill: between(42, 97),
			attendance: between(6, 21),
			officers: between(3, 7),
			dcp: between(0, 4),
			renewed: Math.round(members * (0.3 + rand() * 0.65)), members,
		};
	}
	return club;
}
const sampleArea = (id, director, names, pLive) => ({ id, real: false, director, clubs: names.map((n) => sampleClub(n, pLive)) });

const DISTRICT = {
	id: "DEMO", label: "District DEMO", real: true,
	officers: [
		{ role: "District Director", name: "Marisol Okafor" },
		{ role: "Program Quality Director", name: "Daniel Hsu" },
		{ role: "Club Growth Director", name: null },
	],
	divisions: [
		{
			id: "A", real: true, director: "Renata Silva",
			areas: [
				{
					id: "A1", real: true, director: "Demo Presenter",
					clubs: [
						{ name: "GavelUp Demo Club", real: true, live: true, v1: "9 Oct", v2: null,
							h: { held: 15, sched: 16, roleFill: 88, attendance: 14, officers: 7, dcp: 3, renewed: 18, members: 21 } },
						{ name: "Bayfront Speakers", real: true, live: false, v1: "9 Oct", v2: null, h: null },
						{ name: "Lighthouse Orators", real: true, live: false, v1: null, v2: null, h: null },
						{ name: "Pier Nine Toastmasters", real: true, live: false, v1: null, v2: null, h: null },
					],
				},
				sampleArea("A2", "Kwame Asante", ["Harbor Lights Speakers", "Tidewater Talkers", "Seaglass Communicators", "Anchor Point Toastmasters"], 0.5),
				sampleArea("A3", null, ["Driftwood Speakers", "Saltmarsh Orators", "Breakwater Club", "Gull Island Toastmasters", "Morning Tide Speakers"], 0.45),

const allAreas = () => DISTRICT.divisions.flatMap((d) => d.areas);
const clubsOf = (node) => node.clubs ? node.clubs : node.areas ? node.areas.flatMap((a) => a.clubs) : node.divisions.flatMap((d) => d.areas.flatMap((a) => a.clubs));
const areasOf = (node) => node.clubs ? [node] : node.areas ? node.areas : allAreas();

// ---- Roll-up ------------------------------------------------------------------
function flags(c) {
	if (!c.live) return [];
	const f = [], h = c.h;
	if (h.roleFill < 60) f.push(`Role fill ${h.roleFill}%`);
	if (h.officers < 5) f.push(`${h.officers} of ${OFFICES} officers`);
	if (h.renewed / h.members < 0.5) f.push(`${h.renewed} of ${h.members} renewed`);
	if (h.attendance < 8) f.push(`Attendance ${h.attendance}`);
	if (h.held / h.sched < 0.8) f.push(`Held ${h.held} of ${h.sched} meetings`);
	return f;
}
function rollup(node) {
	const clubs = clubsOf(node), live = clubs.filter((c) => c.live), areas = areasOf(node);
	const avg = (fn) => live.length ? live.reduce((s, c) => s + fn(c.h), 0) / live.length : null;
	const directorPosts = node.clubs ? [node.director] : node.areas ? [node.director, ...node.areas.map((a) => a.director)]
		: [...DISTRICT.officers.map((o) => o.name), ...DISTRICT.divisions.flatMap((d) => [d.director, ...d.areas.map((a) => a.director)])];
	const sum = (fn) => live.reduce((s, c) => s + fn(c.h), 0);
	return {
		clubs: clubs.length, live: live.length, areas: areas.length,
		v1: clubs.filter((c) => c.v1).length, v2: clubs.filter((c) => c.v2).length,
		posts: directorPosts.length, filled: directorPosts.filter(Boolean).length,
		roleFill: avg((h) => h.roleFill), attendance: avg((h) => h.attendance),
		officers: live.length ? sum((h) => h.officers) / (live.length * OFFICES) : null,
		dcp: avg((h) => h.dcp),
		renewals: live.length ? sum((h) => h.renewed) / sum((h) => h.members) : null,
		meetings: live.length ? sum((h) => h.held) / sum((h) => h.sched) : null,
		flagged: live.filter((c) => flags(c).length).length,
	};
}

		const kr = rollup(k);
		const bar = (label, x, txt) => `<span>${label}</span><span class="b"><i style="width:${Math.round((x || 0) * 100)}%"></i></span><span class="n">${txt}</span>`;
		return `<div class="sc-row"><div class="top"><b>${k.label}</b><span class="muted">${k.director ? k.director : `<span class="vacant">Vacant</span>`}</span></div>
			<div class="bars">${bar("On GavelUp", kr.live / kr.clubs, `${kr.live}/${kr.clubs}`)}${bar("Visit 1", kr.v1 / kr.clubs, `${kr.v1}/${kr.clubs}`)}${bar("Role fill", kr.roleFill == null ? 0 : kr.roleFill / 100, kr.roleFill == null ? "—" : Math.round(kr.roleFill) + "%")}</div></div>`;
	}).join("");

	return `
		<div class="scope-tabs" role="tablist" aria-label="Whose briefing">${tabs}</div>
		<div class="brief">
			<div class="brief-main">
				<div><div class="eyebrow">Briefing for the ${roleWord}${node.director ? `, ${node.director}` : node === DISTRICT ? `, ${DISTRICT.officers[0].name}` : " (post vacant)"}</div></div>
				<div class="lede">${lede}</div>
				${sect("Visits due before 30 November", visitItems, "Every club has had its round 1 visit.")}
				${sect("Vacant posts", vacItems, "Every post is filled.")}
				${sect("Clubs worth a call", flagItems, "No club on GavelUp has a figure below threshold.")}
				${sect("Not on GavelUp yet", notLiveItems, "Every club is on GavelUp.")}
				${sect("Going well", strongItems, "No club on GavelUp is clear of every threshold yet.")}
			</div>
			<aside class="scorecard">
				<h3>${node === DISTRICT ? "By division" : "By area"}</h3>
				${scRows}
				<p class="small muted" style="margin:0">Role fill averages clubs on GavelUp only.</p>
			</aside>
		</div>`;
}

// ---- Variant D: Combined ----------------------------------------------------------------
// One scope (breadcrumb drill-down, as in A). On top, callouts for whatever under that scope
// needs attention (from C). Below, the same scope seen as a heat map (B), ranked bars or a table (A).
const pathOf = (n) => n.clubs ? [n.division.id, n.id] : n.areas ? [n.id] : [];
function attentionFor(node) {
	const out = [];
	for (const a of areasOf(node)) {
		const r = rollup(a), left = r.clubs - r.v1;
		if (left && r.v1 / r.clubs < 0.5) out.push({ sev: "bad", kind: "Behind on visits", what: `${a.label}: ${left} of ${r.clubs} clubs not yet visited`, detail: `Round 1 is due in ${DAYS_TO_R1} days.`, owner: a.director ? `AD ${a.director}` : "No Area Director", node: a });
		if (!a.director) out.push({ sev: "bad", kind: "Vacant post", what: `${a.label} has no Area Director`, detail: `${plural(a.clubs.length, "club")} with nobody to visit them.`, owner: `${a.division.label}`, node: a });
		if (r.live / r.clubs < 0.34) out.push({ sev: "", kind: "Low coverage", what: `${a.label}: ${r.live} of ${r.clubs} clubs on GavelUp`, detail: "Health figures here speak for few clubs.", owner: a.director ? `AD ${a.director}` : "", node: a });
	}
	const divs = node.areas ? [node] : node.clubs ? [] : DISTRICT.divisions;
	for (const d of divs) if (!d.director) out.push({ sev: "bad", kind: "Vacant post", what: `${d.label} has no Division Director`, detail: `${plural(d.areas.length, "area")} report to nobody.`, owner: "District DEMO", node: d });
	if (node === DISTRICT) DISTRICT.officers.filter((o) => !o.name).forEach((o) => out.push({ sev: "bad", kind: "Vacant post", what: `No ${o.role}`, detail: "A district officer post is empty.", owner: "District DEMO", node: null }));
	for (const c of clubsOf(node)) {
		const f = flags(c);
		if (f.length) out.push({ sev: f.length > 1 ? "bad" : "", kind: "Club to check on", what: c.name, detail: f.join(" · "), owner: `${c.area.label}${c.area.director ? ` · AD ${c.area.director}` : ""}`, node: c.area, real: c.real });
	}
	return out.sort((x, y) => (x.sev === "bad" ? 0 : 1) - (y.sev === "bad" ? 0 : 1));
}
function clubShow(key, c) {
	const h = c.h;
	if (key === "live") return c.live ? "On GavelUp" : "Not on GavelUp";
	if (key === "v1") return c.v1 ? `Done ${c.v1}` : "Due";
	if (!h) return "No figures";
	return { roleFill: `${h.roleFill}%`, officers: `${h.officers}/${OFFICES}`, renewals: `${h.renewed}/${h.members}`, dcp: `${h.dcp}/${DCP_GOALS}` }[key];
}
function heatFor(node, m) {
	const cell = (c, a, i) => {
		const v = m.club(c), na = v == null;
		return `<button type="button" class="cell ${na ? "na" : ""} ${flags(c).length ? "flagged" : ""}" ${na ? "" : `style="${heatBg(v)}"`} data-go="${a.division.id}/${a.id}" aria-label="${c.name}: ${clubShow(state.metric, c)}" title="${c.name}: ${clubShow(state.metric, c)}"></button>`;
	};
	const areaBlock = (a) => `<div class="area-block">
		<button type="button" class="area-name" data-go="${a.division.id}/${a.id}"><span>${a.label}${a.real ? realTag(a) : tag(a)}</span><span class="v">${m.show(rollup(a))}</span></button>
		<div class="cells">${a.clubs.map((c, i) => cell(c, a, i)).join("")}</div>
		<div class="ad-line">AD: ${person(a.director)}</div></div>`;
	if (node === DISTRICT) return `<div class="heat-cols">${DISTRICT.divisions.map((d) => `<section class="div-col">
		<header><h2><button type="button" class="area-name" data-go="${d.id}" style="background:none;border:0;padding:0;cursor:pointer;font:inherit">${d.label}</button></h2><span class="v">${m.show(rollup(d))}</span></header>
		<div class="ad-line">Division Director: ${person(d.director)} ${d.real ? realTag(d) : tag(d)}</div>
		${d.areas.map(areaBlock).join("")}</section>`).join("")}</div>`;
	if (node.areas) return `<div class="heat-scope">${node.areas.map(areaBlock).join("")}</div>`;
	return `<div class="club-tiles">${node.clubs.map((c) => {
		const v = m.club(c), na = v == null;
		return `<div class="club-tile ${na ? "na" : ""} ${!na && v > 0.55 ? "hi" : ""} ${flags(c).length ? "flagged" : ""}" ${na ? "" : `style="${heatBg(v)}"`}>
			<span class="nm">${c.name}</span><span class="vv">${clubShow(state.metric, c)}</span>
			<span class="small">${c.real ? realTag(c) : tag(c)}</span></div>`;
	}).join("")}</div>`;
}
function barsFor(node, m) {
	const kids = node === DISTRICT ? DISTRICT.divisions : node.areas ? node.areas : node.clubs;
	const isClub = !!node.clubs;
	const rows = kids.map((k) => {
		if (isClub) return { k, v: m.club(k), txt: clubShow(state.metric, k), flag: flags(k).length > 0, go: null };
		const r = rollup(k);
		return { k, v: m.roll(r), txt: m.show(r), flag: r.flagged > 0, go: pathOf(k).join("/") };
	}).sort((x, y) => (y.v ?? -1) - (x.v ?? -1));
	const whole = rollup(node);
	return `<div class="rank">${rows.map((x) => `
		${x.go ? `<button type="button" class="nm" data-go="${x.go}">${x.k.label || x.k.name}</button>` : `<span class="nm static">${x.k.name}</span>`}
		<div class="track ${x.flag ? "flag" : ""}">${x.v == null ? `<span class="none"></span>` : `<i style="width:${Math.max(2, Math.round(Math.min(1, x.v) * 100))}%"></i>`}</div>
		<span class="val">${x.txt}</span>`).join("")}
		<div class="dist">${node.label} overall: <b>${m.show(whole)}</b>. Amber bars contain a club below threshold; hatched means no clubs on GavelUp to measure.</div></div>`;
}
function renderCombined() {
	const node = nodeAt(state.path), r = rollup(node), m = METRICS[state.metric];
	const level = node.clubs ? "area" : node.areas ? "division" : "district";
	const crumbs = [state.path[0] ? `<button type="button" data-path="">District DEMO</button>` : `<span class="here">District DEMO</span>`];
	if (state.path[0]) crumbs.push(`<span class="muted">›</span>`, state.path[1] ? `<button type="button" data-path="${state.path[0]}">Division ${state.path[0]}</button>` : `<span class="here">Division ${state.path[0]}</span>`);
	if (state.path[1]) crumbs.push(`<span class="muted">›</span>`, `<span class="here">Area ${state.path[1]}</span>`);

	const items = attentionFor(node), shown = items.slice(0, 6);
	const here = (n) => n && n !== node && !(n.clubs && node.clubs);
	const attn = items.length ? `<div class="attn">${shown.map((x) => `<div class="attn-card ${x.sev}">
			<span class="tag ${x.sev === "bad" ? "chip-bad" : "chip-warn"}" style="justify-self:start">${x.kind}</span>
			<span class="what">${x.what}${x.real ? realTag({ real: true }) : ""}</span>
			<span class="small muted">${x.detail}</span>
			<span class="small">${x.owner}</span>
			${here(x.node) ? `<button type="button" class="go" data-go="${pathOf(x.node).join("/")}">Open ${x.node.label} →</button>` : ""}
		</div>`).join("")}${items.length > shown.length ? `<div class="attn-more">and ${items.length - shown.length} more under ${node.label}</div>` : ""}</div>`
		: `<div class="attn-clear">Nothing under ${node.label} needs attention right now.</div>`;

	const views = [["heat", "Heat map"], ["bars", "Ranked bars"], ["table", "Table"]]
		.map(([k, l]) => `<button type="button" data-view="${k}" aria-pressed="${k === state.view}">${l}</button>`).join("");
	const chips = Object.entries(METRICS).map(([k, v]) => `<button type="button" data-metric="${k}" aria-pressed="${k === state.metric}">${v.label}</button>`).join("");
	let body;
	if (state.view === "table") {
		// Reuse the Ledger's table for this scope.
		const tmp = document.createElement("div"); tmp.innerHTML = renderLedger();
		body = tmp.querySelector(".table-box").outerHTML;
	} else body = state.view === "heat" ? heatFor(node, m) : barsFor(node, m);
	const legend = state.view === "heat" ? `<div class="legend"><span><span class="ramp"></span> ${m.allClubs ? "no → yes" : "low → high"}</span>${m.allClubs ? "" : `<span><span class="sw na"></span>Not on GavelUp, no figures</span>`}<span><span class="dot"></span>A figure is below threshold</span>${level !== "area" ? "<span>Select a name or square to open that level.</span>" : ""}</div>` : "";

	return `
		<nav class="crumbs" aria-label="Breadcrumb">${crumbs.join("")}</nav>
		<div class="ledger-head">
			<div><div class="eyebrow">${level === "district" ? "District roll-up" : level === "division" ? "Division roll-up" : "Area"}</div><h1>${node.label}${node.real ? realTag(node) : tag(node)}</h1></div>
			<div class="officers">${level === "district" ? DISTRICT.officers.map((o) => `<span>${o.role}: <b>${person(o.name)}</b></span>`).join("") : `<span>${level === "division" ? "Division Director" : "Area Director"}: <b>${person(node.director)}</b></span>`}</div>
		</div>
		<div class="eyebrow" style="margin-bottom:8px">Needs attention <span class="muted">· ${items.length}</span></div>
		${attn}
		<div class="strip">
			<div><span class="eyebrow">Clubs on GavelUp</span><span class="big">${ratio(r.live, r.clubs)}</span>${meter(r.live / r.clubs)}</div>
			<div><span class="eyebrow">Round 1 visits</span><span class="big">${ratio(r.v1, r.clubs)}</span>${meter(r.v1 / r.clubs)}<span class="small muted">Due 30 Nov · ${DAYS_TO_R1} days left</span></div>
			<div><span class="eyebrow">Director posts filled</span><span class="big">${ratio(r.filled, r.posts)}</span>${meter(r.filled / r.posts)}</div>
			<div><span class="eyebrow">Role fill, clubs on GavelUp</span><span class="big">${r.roleFill == null ? "—" : Math.round(r.roleFill) + "%"}</span>${meter(r.roleFill == null ? 0 : r.roleFill / 100)}</div>
		</div>
		<div class="toolbar">
			<div class="seg" role="group" aria-label="Show as">${views}</div>
			${state.view === "table" ? "" : `<div class="metric-chips" role="group" aria-label="Measure">${chips}</div>`}
		</div>
		${body}${legend}
		<p class="foot">Health figures average the clubs on GavelUp only. A club not on GavelUp counts toward visits and coverage but adds no health figures.</p>`;
}

// ---- Wiring ---------------------------------------------------------------------------
const view = document.getElementById("view");
function render() {
	const v = VARIANTS.find((x) => x.key === state.variant) || VARIANTS[0];
	view.innerHTML = v.render();
	document.getElementById("vlabel").innerHTML = `${v.key.toUpperCase()} <span>— ${v.name}</span>`;
}
function setVariant(key) {
	state.variant = key;
	try { history.replaceState(null, "", `#${key}`); } catch (e) { location.hash = key; }
	render();
}
function step(dir) {
	const i = VARIANTS.findIndex((x) => x.key === state.variant);
	setVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key);
}
document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));
document.addEventListener("keydown", (e) => {
	const t = e.target;
	if (t && (t.matches("input, textarea, select") || t.isContentEditable)) return;
	if (e.key === "ArrowLeft") step(-1);
	if (e.key === "ArrowRight") step(1);
});
view.addEventListener("click", (e) => {
	const el = e.target.closest("[data-go],[data-view],[data-path],[data-drill],[data-metric],[data-club],[data-area],[data-scope]");
	if (!el) return;
	if (el.dataset.go !== undefined) state.path = el.dataset.go ? el.dataset.go.split("/") : [];
	else if (el.dataset.view) state.view = el.dataset.view;
	else if (el.dataset.path !== undefined) state.path = el.dataset.path ? [el.dataset.path] : [];
	else if (el.dataset.drill) state.path = [...state.path, el.dataset.drill];
	else if (el.dataset.metric) state.metric = el.dataset.metric;
	else if (el.dataset.club) { const [area, i] = el.dataset.club.split(":"); state.sel = { kind: "club", area, i: Number(i) }; }
	else if (el.dataset.area) state.sel = { kind: "area", area: el.dataset.area };
	else if (el.dataset.scope) state.scope = el.dataset.scope;
	render();
});
const mark = document.getElementById("mark-sample");
mark.addEventListener("change", () => document.body.classList.toggle("mark-sample", mark.checked));
document.body.classList.add("mark-sample");
const h = (location.hash || "").replace("#", "");
if (VARIANTS.some((x) => x.key === h)) state.variant = h;
render();
</script>
