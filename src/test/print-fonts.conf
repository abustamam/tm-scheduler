<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Which face the browser-backed geometry suites measure with.

    Those suites launch Chrome with the host resolver mapped to NOTFOUND, so
    Fraunces and Manrope never load and every layout is drawn in a fallback.
    Which fallback was the machine's answer, not the repo's: a stock Ubuntu
    desktop lands on Noto Sans, GitHub's ubuntu-latest runner on DejaVu Sans.
    That moved the editorial agenda's fit scale from 0.7239 to 0.71603 against
    a 0.72 floor, so the density gate failed on a developer's machine and
    passed in CI on identical code.

    WHAT THIS RULE ACTUALLY MOVES, measured rather than assumed. The sans stack
    is 'Manrope', ui-sans-serif, system-ui, sans-serif, and the family that
    resolves is system-ui, NOT the CSS generic at the end. Prepending to the
    fontconfig sans-serif pattern is what redirects system-ui; the CSS generic
    sans-serif is unaffected by it. Measured heights of the real stack in a
    200px column (print-fonts.test.ts): DejaVu Sans 940, Noto Sans 828,
    Liberation Sans 739, with a box declaring system-ui alone tracking it
    exactly and a box declaring sans-serif alone pinned flat at 739.

    There is deliberately NO serif rule. The same prepend on the serif pattern
    measures 694 whichever face it names, so the serif stack is untouched by
    this mechanism and a rule for it would be decoration that reads as
    protection. print-fonts.test.ts asserts the serif number too, so if it ever
    does start varying by machine the result is a named red test rather than
    another month of a gate that disagrees with CI.

    Chrome version is NOT a variable here: identical to sixteen decimal places
    across 143, 147, 151 and 153.

    Set as FONTCONFIG_FILE by print-page-count.ts. It pins the FALLBACK, not
    the real face, so every Linux machine agrees with CI at today's numbers and
    no constant is re-baselined. It does NOT make these numbers comparable to
    the deployed page, which loads the real fonts.

    Keep this comment free of a doubled hyphen: XML forbids one inside a
    comment, and fontconfig answers a malformed file by discarding it whole and
    silently falling back to the system config. The first draft of this file
    said "host dash dash resolver" literally and was dead on arrival, which
    read as "the pin does not work" because every wrapper around it still
    looked healthy: the path resolved, the file existed, Chrome started, and
    the suites failed exactly as before. print-fonts.test.ts is what turns that
    into a red test instead of an afternoon.
  -->
  <!-- FONTCONFIG_FILE REPLACES the system config rather than adding to it, so
       without this the browser would find no fonts at all. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
